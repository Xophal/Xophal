<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Xophal logo">
  <defs>
    <linearGradient id="xMark" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="42%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6ad0ff"/>
    </linearGradient>
    <linearGradient id="xGlow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1dd3ff"/>
      <stop offset="45%" stop-color="#2a7bff"/>
      <stop offset="100%" stop-color="#0a0f2a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="28" fill="#03070d"/>

  <g filter="url(#softGlow)">
    <rect x="42" y="12" width="34" height="230" rx="18" transform="rotate(-35 59 127)" fill="url(#xMark)"/>
    <rect x="154" y="12" width="34" height="230" rx="18" transform="rotate(35 171 127)" fill="url(#xGlow)"/>
  </g>
</svg>
